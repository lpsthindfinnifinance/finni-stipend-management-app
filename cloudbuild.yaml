steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:latest'
      - '.'
    timeout: 1200s

  # Push the versioned image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:$COMMIT_SHA'

  # Push the latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finni-stipend-management-app'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,SESSION_SECRET=SESSION_SECRET:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,SLACK_BOT_TOKEN=SLACK_BOT_TOKEN:latest,SLACK_FINANCE_GROUP_ID=SLACK_FINANCE_GROUP_ID:latest,OIDC_CLIENT_ID=OIDC_CLIENT_ID:latest,OIDC_CLIENT_SECRET=OIDC_CLIENT_SECRET:latest,OIDC_ISSUER_URL=OIDC_ISSUER_URL:latest'
      - '--set-env-vars=NODE_ENV=production,REPLIT_DOMAINS=finni-stipend-management-app-401300973899.europe-west1.run.app'
      - '--max-instances=100'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--timeout=300'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finni-stipend-management-app/finni-stipend-management-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1800s
